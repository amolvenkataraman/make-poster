<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@page { size: 8.5in 11in; margin: 0 }
* { box-sizing: border-box; margin: 0; padding: 0 }
body { font-family: "DejaVu Sans", Arial, sans-serif }
.poster { width: 8.5in; height: 11in; padding: 0.6in; display: flex; flex-direction: column }
.content { margin: auto 0 }
h1 { font-size: 72pt; line-height: 1.0 }
p { font-size: 16pt; line-height: 1.35; margin-top: 12pt }
.cta { border: 1.5pt solid #000; padding: 12pt; font-size: 14pt }
.card { height: 1in; overflow: hidden; border: 1pt solid #000; padding: 8pt; font-size: 16pt; line-height: 1.35 }
</style>
</head>
<body>
<!-- A fixed-height card that hides the end of its text -->
<div class="poster">
  <header>make-poster</header>
  <div class="content">
    <h1>Clipped.</h1>
    <div class="card">This card is one inch tall, but its text needs five or six lines. The card hides everything after the second line, so the end of this sentence, and the next one, never make it onto the printed poster. Nobody walking past will ever read them.</div>
  </div>
  <div class="cta">example.com</div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@page { size: 8.5in 11in; margin: 0 }
* { box-sizing: border-box; margin: 0; padding: 0 }
body { font-family: "DejaVu Sans", Arial, sans-serif }
.poster { width: 8.5in; height: 11in; padding: 0.6in; display: flex; flex-direction: column }
.content { margin: auto 0 }
h1 { font-size: 72pt; line-height: 1.0 }
p { font-size: 16pt; line-height: 1.35; margin-top: 12pt }
.cta { border: 1.5pt solid #000; padding: 12pt; font-size: 14pt }
.sticker { margin: -0.3in 0 0 auto; width: 1.4in; height: 1.4in; border-radius: 50%; background: #f60 }
</style>
</head>
<body>
<!-- A sticker that overlaps the headline on purpose, marked data-fit="ignore" -->
<div class="poster">
  <header>make-poster</header>
  <div class="content">
    <h1>Overlap on<br>purpose.</h1>
    <div class="sticker" data-fit="ignore"></div>
  </div>
  <div class="cta">example.com</div>
</div>
</body>
</html>

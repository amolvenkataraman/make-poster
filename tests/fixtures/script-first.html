<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@page { size: 8.5in 11in; margin: 0 }
* { box-sizing: border-box; margin: 0; padding: 0 }
body { font-family: "DejaVu Sans", Arial, sans-serif }
.poster { width: 8.5in; height: 11in; padding: 0.6in; display: flex; flex-direction: column }
.content { margin: auto 0 }
h1 { font-size: 72pt; line-height: 1.0 }
p { font-size: 16pt; line-height: 1.35; margin-top: 12pt }
.cta { border: 1.5pt solid #000; padding: 12pt; font-size: 14pt }
</style>
</head>
<body>
<script>/* An element before the poster: render.mjs used to size previews from it */</script>
<div class="poster">
  <header>make-poster</header>
  <div class="content"><h1>Measured<br>by .poster.</h1></div>
  <div class="cta">example.com</div>
</div>
</body>
</html>
